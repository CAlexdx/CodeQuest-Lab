{% extends "base.html" %}
{% block title %}Studio CSS - CodeQuest LAB{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>🎨 Studio CSS</h1>
    <p>Crie e estilize componentes em tempo real e copie o CSS gerado.</p>
  </div>

  <div class="studio-layout">
    <aside class="card">
      <h3>Ajustes do componente</h3>
      <div class="controls">
        <div class="field full">
          <label for="css-component-select">Componente</label>
          <select id="css-component-select" class="select">
            <option value="botao">Botão</option>
            <option value="card">Card</option>
            <option value="input">Input</option>
            <option value="badge">Badge</option>
            <option value="navbar">Navbar</option>
            <option value="alerta">Alerta</option>
          </select>
        </div>
        <div class="field full">
          <label for="css-text-input">Texto do elemento</label>
          <input type="text" id="css-text-input" class="input" value="Clique Aqui" maxlength="40">
        </div>
        <div class="pair full" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
          <div class="field"><label for="css-bg-color">Fundo</label><input type="color" id="css-bg-color" value="#2563eb"></div>
          <div class="field"><label for="css-text-color">Texto</label><input type="color" id="css-text-color" value="#ffffff"></div>
          <div class="field"><label for="css-border-color">Borda</label><input type="color" id="css-border-color" value="#3b82f6"></div>
        </div>
        <div class="field"><label for="css-font-size">Fonte <span class="val" id="lbl-font-size">16px</span></label><input type="range" id="css-font-size" min="10" max="32" value="16"></div>
        <div class="field"><label for="css-font-weight">Peso <span class="val" id="lbl-font-weight">600</span></label><input type="range" id="css-font-weight" min="300" max="900" step="100" value="600"></div>
        <div class="field"><label for="css-padding-v">Espaço vertical <span class="val" id="lbl-padding-v">12px</span></label><input type="range" id="css-padding-v" min="0" max="40" value="12"></div>
        <div class="field"><label for="css-padding-h">Espaço lateral <span class="val" id="lbl-padding-h">24px</span></label><input type="range" id="css-padding-h" min="0" max="60" value="24"></div>
        <div class="field"><label for="css-radius">Arredondamento <span class="val" id="lbl-radius">8px</span></label><input type="range" id="css-radius" min="0" max="40" value="8"></div>
        <div class="field"><label for="css-border-width">Borda <span class="val" id="lbl-border-width">2px</span></label><input type="range" id="css-border-width" min="0" max="10" value="2"></div>
        <div class="field"><label for="css-shadow">Sombra <span class="val" id="lbl-shadow">10px</span></label><input type="range" id="css-shadow" min="0" max="30" value="10"></div>
        <div class="field">
          <label for="css-border-style">Estilo da borda</label>
          <select id="css-border-style" class="select"><option value="solid">solid</option><option value="dashed">dashed</option><option value="dotted">dotted</option><option value="double">double</option></select>
        </div>
        <label class="check full"><input type="checkbox" id="css-include-hover" checked> Incluir efeito :hover no CSS</label>
      </div>
    </aside>

    <section>
      <div id="css-preview-container" class="preview-box" aria-live="polite"></div>
      <div class="editor-wrap" style="margin-top:14px">
        <div class="editor-bar">
          <span>CSS gerado</span>
          <button type="button" id="btn-copy" class="btn btn-sm">Copiar CSS</button>
        </div>
        <label for="generated-css-code" class="sr-only">CSS gerado</label>
        <textarea id="generated-css-code" class="code-editor" readonly spellcheck="false" style="min-height:200px"></textarea>
      </div>
      <p id="copy-msg" style="font-size:12px;margin-top:8px;min-height:18px" role="status"></p>
    </section>
  </div>
{% endblock %}
{% block scripts %}<script src="/static/js/css-studio.js?v={{ asset_v }}" defer></script>{% endblock %}
